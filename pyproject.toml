[project]
name = "chainlinkd"
version = "0.1.0"
description = "A terminal habit tracker built with Textual."
authors = [{ name = "lewis-gabriel-geissler" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.7",
    "platformdirs>=4.10.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "textual-dev>=1.7.0",
]

[project.scripts]
chainlinkd = "chainlinkd.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chainlinkd"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
